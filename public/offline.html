<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7ec" />
    <title>연결이 끊겼어요 · 오늘 간식 왔나요?</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        padding: 24px 18px calc(32px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #3d2d1e;
        background-color: #fff7ec;
        background-image:
          radial-gradient(circle at 12% 8%, #ffe7c6 0%, rgba(255, 231, 198, 0) 45%),
          radial-gradient(circle at 88% 4%, #ffe0e8 0%, rgba(255, 224, 232, 0) 40%),
          radial-gradient(circle at 50% 100%, #fff0d6 0%, rgba(255, 240, 214, 0) 55%);
        font-family:
          "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
          "Noto Sans KR", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      .card {
        width: 100%;
        max-width: 360px;
        padding: 30px 24px 26px;
        text-align: center;
        background: #fffdfa;
        border: 1px solid #f7e9d6;
        border-radius: 28px;
        box-shadow: 0 28px 60px -38px rgba(122, 78, 26, 0.5);
      }
      .cookie {
        font-size: 54px;
        line-height: 1;
      }
      h1 {
        margin: 14px 0 8px;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        font-size: 13.5px;
        line-height: 1.65;
        color: #8b7761;
      }
      button {
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        color: #fff;
        background: #d08f4b;
        border: none;
        border-radius: 999px;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="cookie" aria-hidden="true">🍪</div>
      <h1>지금은 연결이 끊겼어요</h1>
      <p>인터넷이 다시 연결되면 최신 간식 소식을 그대로 보여 드릴게요.<br />와이파이나 데이터를 확인해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
